let deck=[];
let current=0;
let score=0;
let streak=0;
let errors=[];

function shuffle(array){

    for(let i=array.length-1;i>0;i--){

        const j=
        Math.floor(Math.random()*(i+1));

        [array[i],array[j]]=
        [array[j],array[i]];
    }

    return array;
}

function startGame(){

    const selected =
    document.getElementById("unitSelect").value;

    const direction =
    document.getElementById("direction").value;

    let source=[];

 if(selected==="1-2"){

    source=[
        ...units[1],
        ...units[2]
    ];

}
else if(selected==="1-3"){

    source=[
        ...units[1],
        ...units[2],
        ...units[3]
    ];

}
else if(selected==="1-4"){

    source=[
        ...units[1],
        ...units[2],
        ...units[3],
        ...units[4]
    ];

}
else if(selected==="all"){

    source=[
        ...units[1],
        ...units[2],
        ...units[3],
        ...units[4],
        ...units[5]
    ];

}
else{

    source=[
        ...units[selected]
    ];

}

    deck=[];

    source.forEach(card=>{

        if(direction==="EN_ES"){

            deck.push({
                q:card.q,
                a:card.a
            });

        }else{

            deck.push({
                q:card.a,
                a:card.q
            });

        }

    });

    shuffle(deck);

deck = deck.slice(0,10);

    current=0;
    score=0;
    streak=0;
    errors=[];

    document.getElementById("score").textContent="0";
    document.getElementById("streak").textContent="0";

    document.getElementById("reviewBtn").style.display="none";

    showCard();
}

function showCard(){

    if(current>=deck.length){

        finishGame();
        return;
    }

    document.getElementById("question").textContent=
    deck[current].q;

    document.getElementById("answer").value="";

    document.getElementById("result").textContent="";

    const percent=
    (current/deck.length)*100;

    document.getElementById("bar").style.width=
    percent+"%";

    document.getElementById("progressText").textContent=
    Math.round(percent)+"%";

    document.getElementById("questionCounter").textContent=
    (current+1)+" de "+deck.length;
}

function checkAnswer(){

    const user=
    document.getElementById("answer")
    .value
    .trim()
    .toLowerCase();

    const correct=
    deck[current].a.toLowerCase();

    if(user===correct){

        score+=10;
        streak++;

        document.getElementById("result").textContent=
        "✅ Correcto";

    }else{

        streak=0;

        errors.push(deck[current]);

        document.getElementById("result").textContent=
        "❌ Correcta: "+deck[current].a;
    }

    document.getElementById("score").textContent=
    score;

    document.getElementById("streak").textContent=
    streak;

    updateMedal();

    current++;

    setTimeout(showCard,1000);
}

function updateMedal(){

    let medal="🥉";

    if(score>=20){
        medal="🥇";
    }
    else if(score>=10){
        medal="🥈";
    }

    document.getElementById("medal").textContent=
    medal;
}

function finishGame(){

    document.getElementById("question").textContent=
    "🎉 Juego terminado";

    document.getElementById("bar").style.width=
    "100%";

    document.getElementById("progressText").textContent=
    "100%";

    document.getElementById("questionCounter").textContent=
    deck.length+" de "+deck.length;

    let best=
    localStorage.getItem("record");

    if(!best || score>Number(best)){

        localStorage.setItem(
            "record",
            score
        );

        best=score;
    }

    document.getElementById("record").textContent=
    best;

    if(errors.length>0){

        document.getElementById("reviewBtn")
        .style.display="inline-block";
    }
}

function reviewErrors(){

    deck=[...errors];

    errors=[];

    current=0;

    document.getElementById("reviewBtn")
    .style.display="none";

    showCard();
}

document.getElementById("answer")
.addEventListener("keydown",function(e){

    if(e.key==="Enter"){
        checkAnswer();
    }

});

const saved=
localStorage.getItem("record");

if(saved){

    document.getElementById("record")
    .textContent=saved;
}
